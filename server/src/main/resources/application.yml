server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maian-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/maian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:maian}
    password: ${MYSQL_PASSWORD:maian_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    enabled: ${APP_AI_ENABLED:false}
  upload:
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:5242880}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
