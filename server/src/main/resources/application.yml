server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maian-server
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/maian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:maian}
    password: ${MYSQL_PASSWORD:maian_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:disabled}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    enabled: ${APP_AI_ENABLED:false}
  upload:
    directory: ${UPLOAD_DIRECTORY:./data/uploads}
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:5242880}
  dispatch:
    search-radius-km: ${DISPATCH_SEARCH_RADIUS_KM:15}
    candidate-limit: ${DISPATCH_CANDIDATE_LIMIT:80}
    mobile-location-max-age-seconds: ${DISPATCH_LOCATION_MAX_AGE_SECONDS:120}
    mobile-speed-kmh: ${DISPATCH_MOBILE_SPEED_KMH:35}
    runner-speed-kmh: ${DISPATCH_RUNNER_SPEED_KMH:6.5}
    route-distance-factor: ${DISPATCH_ROUTE_DISTANCE_FACTOR:1.25}
    mobile-dispatch-overhead-seconds: ${DISPATCH_MOBILE_OVERHEAD_SECONDS:30}
    fixed-pickup-overhead-seconds: ${DISPATCH_FIXED_OVERHEAD_SECONDS:20}
    reservation-timeout-seconds: ${DISPATCH_RESERVATION_TIMEOUT_SECONDS:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
