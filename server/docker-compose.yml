services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maian}
      MYSQL_USER: ${MYSQL_USER:-maian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maian_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - maian_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-maian}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USER: ${MYSQL_USER:-maian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maian_dev}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_DIRECTORY: /app/data/uploads
      APP_AI_ENABLED: ${APP_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - maian_uploads:/app/data/uploads

volumes:
  maian_mysql:
  maian_uploads:
