services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: maian
      MYSQL_USER: maian
      MYSQL_PASSWORD: maian_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - maian_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  maian_mysql:
