server {
    listen 80;
    server_name 121.41.195.165;

    root /var/www/maian;
    index index.html;

    # SPA路由 - 所有非文件请求回退到index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 视频代理 - AED教程（宁夏卫健委）
    location /video-proxy/nxgov/ {
        proxy_pass https://www.nx.gov.cn/;
        proxy_set_header Host www.nx.gov.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # 视频代理 - 心肺复苏（贵州福泉）
    location /video-proxy/gzfuquan/ {
        proxy_pass https://www.gzfuquan.gov.cn/;
        proxy_set_header Host www.gzfuquan.gov.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # 视频代理 - 海姆立克（百度云CDN）
    location /video-proxy/bcebos/ {
        proxy_pass https://medical-cms.cdn.bcebos.com/;
        proxy_set_header Host medical-cms.cdn.bcebos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }
}
